{# Icons for the sidebar. A service picks one with the `icon` column of the modules table; unknown names get "grid". #}
{% macro icon(name) -%}
<svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'leads' %}<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>
{%- elif name == 'attendance' %}<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M9 15l2 2 4-4"/>
{%- elif name == 'manpower' %}<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.6"/><path d="M17.5 14.2c2.4.3 4 2 4 4.8"/>
{%- elif name == 'material' %}<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>
{%- elif name == 'clients' %}<path d="M3 21V7l8-4v18"/><path d="M11 9l10 4v8"/><path d="M2 21h20M7 9h.01M7 13h.01M7 17h.01M16 17h.01M16 13h.01"/>
{%- elif name == 'projects' %}<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M8 13h8"/>
{%- elif name == 'user' %}<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>
{%- elif name == 'wages' %}<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 6v.01M18 6v.01M6 18v.01M18 18v.01"/>
{%- elif name == 'fooding' %}<path d="M7 2v7a2 2 0 0 0 2 2v11M7 2v6M10 2v6"/><path d="M17 2c-1.7 0-3 2-3 5s1.3 5 3 5v9"/>
{%- elif name == 'petrol' %}<path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/><path d="M3 21h12M6 8h6"/><path d="M14 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V9l-3-3"/>
{%- elif name == 'commission' %}<circle cx="7" cy="7" r="3"/><circle cx="17" cy="17" r="3"/><path d="M5 19 19 5"/>
{%- elif name == 'cash' %}<rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/><circle cx="17" cy="14" r="1.6"/>
{%- elif name == 'schedule' %}<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/><path d="M8 14h3M8 17h6"/>
{%- else %}<rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/>
{%- endif %}
</svg>
{%- endmacro %}
