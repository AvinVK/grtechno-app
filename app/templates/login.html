{% extends "base.html" %}
{% block title %}Sign in - Lead desk{% endblock %}
{% block body_class %}page-login{% endblock %}
{% block header %}{% endblock %}
{% block content %}
<main class="login">
  <form class="login-card" method="post" action="{{ url_for('auth.login') }}">
    <p class="brand"><span class="brand-mark" aria-hidden="true"></span>Lead desk</p>
    <h1>Sign in</h1>
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" autofocus required
             {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %}>
      {% if error %}<p class="err" id="login-error" role="alert">{{ error }}</p>{% endif %}
    </div>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</main>
{% endblock %}
