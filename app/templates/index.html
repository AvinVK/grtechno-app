{% extends "base.html" %}
{% block title %}Leads{% endblock %}
{% block body_class %}page-app{% endblock %}

{% block hub_back %}{% endblock %}{# here the bottom nav's Me leads to the hub #}

{% block actions %}
  <button class="icon-btn" id="search-btn" type="button" aria-label="Search leads" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  </button>
  <a class="link-btn hide-narrow" href="{{ url_for('views.export_csv') }}">Export CSV</a>
{% endblock %}

{% block content %}
<main id="view" class="view" tabindex="-1" data-export-url="{{ url_for('views.export_csv') }}"><p class="loading">Loading leads…</p></main>



<div class="overlay" id="overlay" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>

<script src="{{ asset('js/app.js') }}" defer></script>
{% endblock %}
