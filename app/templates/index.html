{% extends "base.html" %}
{% block title %}Lead desk{% endblock %}
{% block body_class %}page-app{% endblock %}

{% block actions %}
  <a class="link-btn hide-narrow" href="{{ url_for('views.export_csv') }}">Export CSV</a>
  <a class="link-btn" href="{{ url_for('views.settings') }}">Settings</a>
{% endblock %}

{% block content %}
<section class="summary" id="summary" aria-label="Summary"></section>
<main id="view" class="view" tabindex="-1" data-export-url="{{ url_for('views.export_csv') }}"><p class="loading">Loading leads…</p></main>

<nav class="bottom-nav" aria-label="Main">
  <a class="bottom-nav-item" href="#active" data-view="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
    <span>Active leads</span>
    <b class="nav-badge" hidden></b>
  </a>
  <button class="bottom-nav-item add" id="new-lead" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <span>Add lead</span>
  </button>
  <a class="bottom-nav-item" href="#closed" data-view="closed">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
    <span>Won / Lost</span>
  </a>
</nav>

<div class="overlay" id="overlay" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
{% endblock %}
